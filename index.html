<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#20372f" />
  <meta name="description" content="A gentle, interactive Hindi articulation and voice practice studio." />
  <title>VoiceSadhana — find your voice</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#home" aria-label="VoiceSadhana home">
        <span class="brand-mark"><i></i><i></i><i></i></span>
        <span class="brand-name">voice<span>sadhana</span></span>
      </a>
      <div class="side-label">YOUR STUDIO</div>
      <nav class="side-nav">
        <button class="nav-item active" data-route="home"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10 8.5-7 8.5 7v10.5a1 1 0 0 1-1 1h-5.3v-7h-4.4v7H4.5a1 1 0 0 1-1-1z"/></svg></span><span>Home</span></button>
        <button class="nav-item" data-route="practice"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3l2-6 4 12 3-9 2 3h4"/></svg></span><span>Practice</span><span class="nav-count">2</span></button>
        <button class="nav-item" data-route="progress"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/><path d="M2 21h20"/></svg></span><span>Progress</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="side-card"><div class="side-card-orb">✦</div><p>Small steps.<br><strong>Steady voice.</strong></p><span>Your practice is yours.</span></div>
        <button class="nav-item" data-route="settings"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6z"/><path d="m19.3 13.5 1.2.9-1.8 3.1-1.4-.6a7.8 7.8 0 0 1-1.7 1l-.2 1.5h-3.6l-.2-1.5a7.8 7.8 0 0 1-1.7-1l-1.4.6-1.8-3.1 1.2-.9a7.5 7.5 0 0 1 0-2l-1.2-.9 1.8-3.1 1.4.6a7.8 7.8 0 0 1 1.7-1l.2-1.5h3.6l.2 1.5a7.8 7.8 0 0 1 1.7 1l1.4-.6 1.8 3.1-1.2.9a7.5 7.5 0 0 1 0 2z"/></svg></span><span>Settings</span></button>
        <div class="profile-mini"><div class="avatar">न</div><div><strong>My practice</strong><small>Foundation · Level <span id="side-level">1</span></small></div><span class="more">•••</span></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-brand"><span class="brand-mark"><i></i><i></i><i></i></span><strong>Voice<span>Sadhana</span></strong><i class="topbar-divider"></i><div class="breadcrumb"><span>YOUR STUDIO</span><b>/</b><strong id="crumb-current">HOME</strong></div></div>
        <div class="top-actions"><button class="icon-button" id="help-button" aria-label="Help">?</button><button class="streak-pill" id="streak-pill"><span class="flame"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.4 2.2c.6 3.5-1.1 4.9-2.8 6.8-1.2 1.3-2.1 2.7-2.1 4.8a5 5 0 0 0 9.9.9c.6-2.6-.6-4.7-2.2-6.3.1 2.4-1.1 3.3-2.2 3.6.4-3.5-.5-6.8-.6-9.8z" fill="currentColor"/><path d="M12.1 14.3c-1.3 1.2-2 2.2-2 3.5a2.1 2.1 0 0 0 4.2 0c0-1.2-.8-2.3-2.2-3.5z" fill="#fff8e9"/></svg></span><span><strong id="streak-count">0</strong><small>day streak</small></span></button></div>
      </header>
      <div id="app-content" class="page-content" aria-live="polite"></div>
      <nav class="mobile-nav" aria-label="Main navigation">
        <button class="active" data-route="home"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10 8.5-7 8.5 7v10.5a1 1 0 0 1-1 1h-5.3v-7h-4.4v7H4.5a1 1 0 0 1-1-1z"/></svg></span>Home</button><button data-route="practice"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3l2-6 4 12 3-9 2 3h4"/></svg></span>Practice</button><button data-route="progress"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3M2 21h20"/></svg></span>Progress</button><button data-route="settings"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.8v2m0 14.4v2m9.2-9.2h-2M4.8 12h-2m15.7-6.5-1.4 1.4M6.9 17.1l-1.4 1.4m13 0-1.4-1.4M6.9 6.9 5.5 5.5"/></svg></span>Settings</button>
      </nav>
    </main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <div id="overlay-root"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
