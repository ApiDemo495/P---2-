<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101d31" />
  <meta name="description" content="A gentle, interactive Hindi articulation and voice practice studio." />
  <title>VoiceSadhana — find your voice</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#home" aria-label="VoiceSadhana home">
        <span class="brand-mark"><i></i><i></i><i></i></span>
        <span class="brand-name">voice<span>sadhana</span></span>
      </a>
      <div class="side-label">YOUR STUDIO</div>
      <nav class="side-nav">
        <button class="nav-item active" data-route="home"><span class="nav-icon">⌂</span><span>Home</span></button>
        <button class="nav-item" data-route="practice"><span class="nav-icon">◉</span><span>Practice</span><span class="nav-count">2</span></button>
        <button class="nav-item" data-route="progress"><span class="nav-icon">▥</span><span>Progress</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="side-card"><div class="side-card-orb">✦</div><p>Small steps.<br><strong>Steady voice.</strong></p><span>Your practice is yours.</span></div>
        <button class="nav-item" data-route="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
        <div class="profile-mini"><div class="avatar">न</div><div><strong>My practice</strong><small>Foundation · Level <span id="side-level">1</span></small></div><span class="more">•••</span></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>YOUR STUDIO</span><b>/</b><strong id="crumb-current">HOME</strong></div>
        <div class="top-actions"><button class="icon-button" id="help-button" aria-label="Help">?</button><button class="streak-pill" id="streak-pill"><span class="flame">♨</span><span><strong id="streak-count">0</strong><small>day streak</small></span></button></div>
      </header>
      <div id="app-content" class="page-content" aria-live="polite"></div>
      <nav class="mobile-nav" aria-label="Mobile navigation">
        <button class="active" data-route="home"><span>⌂</span>Home</button><button data-route="practice"><span>◉</span>Practice</button><button data-route="progress"><span>▥</span>Progress</button><button data-route="settings"><span>⚙</span>Settings</button>
      </nav>
    </main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <div id="overlay-root"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
